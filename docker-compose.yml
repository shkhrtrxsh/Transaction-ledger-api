services:
  postgres:
    image: postgres:16-alpine
    container_name: transaction-ledger-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transaction_ledger
    ports:
      - "5432:5432"
    volumes:
      - transaction_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transaction_ledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transaction_ledger_pgdata:
